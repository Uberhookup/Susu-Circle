  if (!d.open) d.showModal();
}
function closeGroupDialog() {
  const d = document.getElementById("groupDialog");
  if (d.open) d.close();
}

function renderGroupList() {
  const visible = visibleGroupIds();
  const html = visible.map(gid => {
    const g = app.groups[gid];
    if (!g) return "";
    const isActive = gid === app.activeGroupId;
    const n = g.members.length;
    const amt = formatMoneyShort(g.group.amount, g.group.currency);
    const agent = (!isAgent() && g.agentId) ? app.agents[g.agentId] : null;
    const meta = `${n} member${n === 1 ? "" : "s"} · ${amt} ${g.group.frequency.toLowerCase()}`;
    const canDelete = visible.length > 1;
    return `<div class="group-row${isActive ? " active" : ""}">
      <button class="group-pick" type="button" data-action="switch-group" data-gid="${esc(gid)}">
        <div class="group-name">${esc(g.group.name)}${agent ? `<span class="group-agent">${esc(agent.name)}</span>` : ""}</div>
        <div class="group-meta">${esc(meta)}</div>
      </button>
      <span class="group-check">${isActive ? "✓" : ""}</span>
      <button class="btn ghost sm" type="button" data-action="rename-group" data-gid="${esc(gid)}" title="Rename" aria-label="Rename ${esc(g.group.name)}">✎</button>
      ${canDelete ? `<button class="btn ghost sm" type="button" data-action="delete-group" data-gid="${esc(gid)}" title="Delete" aria-label="Delete ${esc(g.group.name)}" style="color:var(--red)">✕</button>` : ""}
    </div>`;
  }).join("");
  document.getElementById("groupList").innerHTML = html || '<div class="payout-empty">No circles yet</div>';
}

function newGroup() {
  const name = prompt("Name for new circle:", "New Susu");
  if (!name || !name.trim()) return;
  const id = "g" + Math.random().toString(36).slice(2, 9);
  const g = blankGroup(id);
  g.group.name = name.trim().slice(0, 60);
  if (isAgent()) g.agentId = session.agentId;
  app.groups[id] = g;
  app.groupOrder.push(id);
  app.activeGroupId = id;
  state = g;
  formatter = makeMoneyFormatter(LOCALE, g.group.currency);
  ensureCycleOrder();
  save(); render(); closeGroupDialog();
  toast(`Created ${g.group.name}`);
}

function renameGroup(gid) {
  const g = app.groups[gid];
  if (!g) return;
  if (isAgent() && g.agentId !== session.agentId) { toast("Not your circle"); return; }
  const name = prompt("Rename circle:", g.group.name);
  if (!name || !name.trim()) return;
  g.group.name = name.trim().slice(0, 60);
  save();
  if (gid === app.activeGroupId) render();
  renderGroupList();
  toast("Renamed");
}

function deleteGroup(gid) {
  const visible = visibleGroupIds();
  if (visible.length <= 1) { toast("Can't delete the last circle"); return; }
  const g = app.groups[gid];
  if (!g) return;
  if (isAgent() && g.agentId !== session.agentId) { toast("Not your circle"); return; }
  if (!confirm(`Delete "${g.group.name}"? This can't be undone.`)) return;
  delete app.groups[gid];
  app.groupOrder = app.groupOrder.filter(id => id !== gid);
  if (gid === app.activeGroupId) {
    app.activeGroupId = visible[0] === gid ? visible[1] : visible[0];
    state = app.groups[app.activeGroupId];
    formatter = makeMoneyFormatter(LOCALE, state.group.currency);
    ensureCycleOrder();
    render();
  }
  save(); renderGroupList();
  toast("Deleted");
}

function switchGroup(gid) {
  if (!app.groups[gid]) { closeGroupDialog(); return; }
  if (isAgent() && app.groups[gid].agentId !== session.agentId) {
    toast("Not your circle"); closeGroupDialog(); return;
  }
  if (gid === app.activeGroupId) { closeGroupDialog(); return; }
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; flushSave(); }
  app.activeGroupId = gid;
  state = app.groups[gid];
  formatter = makeMoneyFormatter(LOCALE, state.group.currency);
  editingId = null;
  ensureCycleOrder();
  save(); render(); closeGroupDialog();
  toast(`Switched to ${state.group.name}`);
}

function formatMoneyShort(amount, currency) {
  try {
    return new Intl.NumberFormat(LOCALE, {
      style: "currency", currency, maximumFractionDigits: 0, currencyDisplay: "narrowSymbol"
    }).format(amount);
  } catch (e) { return `${currency} ${Number(amount).toLocaleString()}`; }
}

/* ═══════════════════════════════════════════════════════════════════
   14. AGENT ACTIONS (master only)
   ═══════════════════════════════════════════════════════════════════ */
function newAgent() {
  if (!isMaster()) { toast("Master access required"); return; }
  editingAgentId = null;
  document.getElementById("agName").value = "";
  document.getElementById("agPhone").value = "";
  document.getElementById("agPin").value = "";
  document.getElementById("agTitle").textContent = "New agent";
  document.getElementById("agPinHint").textContent = "Set the agent's initial PIN. They can change it after signing in.";
  document.getElementById("agentDialog").showModal();
  setTimeout(() => document.getElementById("agName").focus(), 40);
}

function editAgent(aid) {
  if (!isMaster()) { toast("Master access required"); return; }
  const a = app.agents[aid];
  if (!a) return;
  editingAgentId = aid;
  document.getElementById("agName").value = a.name;
  document.getElementById("agPhone").value = a.phone || "";
  document.getElementById("agPin").value = "";
  document.getElementById("agTitle").textContent = "Edit agent";
  document.getElementById("agPinHint").textContent = "Leave blank to keep current PIN.";
  document.getElementById("agentDialog").showModal();
  setTimeout(() => document.getElementById("agName").focus(), 40);
}

function saveAgent(e) {
  e.preventDefault();
  if (!isMaster()) { toast("Master access required"); return; }
  const name = document.getElementById("agName").value.trim();
  const phoneRaw = document.getElementById("agPhone").value.trim();
  const pinRaw = (document.getElementById("agPin").value || "").trim();
  const phone = normalizePhone(phoneRaw, ZONE.dial);
  if (!name) { toast("Enter a name"); return; }

  if (editingAgentId) {
    const a = app.agents[editingAgentId];
    if (!a) return;
    a.name = name.slice(0, 60);
    a.phone = phone;
    if (pinRaw) {
      if (pinRaw.length < 4) { toast("PIN must be at least 4 characters"); return; }
      a.pin = simpleHash(pinRaw);
    }
    document.getElementById("agentDialog").close();
    editingAgentId = null;
    save(); render();
    toast("Agent updated");
    return;
  }

  if (!pinRaw || pinRaw.length < 4) { toast("PIN must be at least 4 characters"); return; }
  const aid = "a" + Math.random().toString(36).slice(2, 9);
  app.agents[aid] = {
    id: aid,
    name: name.slice(0, 60),
    phone,
    pin: simpleHash(pinRaw),
    token: genToken(),
    createdAt: new Date().toISOString()
  };
  document.getElementById("agentDialog").close();
  editingAgentId = null;
  save(); render();
  showAgentLinkDialog(aid);
  toast(`Agent ${name.split(' ')[0]} created`);
}

function deleteAgent(aid) {
  if (!isMaster()) { toast("Master access required"); return; }
  const a = app.agents[aid];
  if (!a) return;
  const assigned = app.groupOrder.filter(gid => app.groups[gid].agentId === aid).length;
  const msg = assigned > 0
    ? `Delete agent "${a.name}"? ${assigned} circle${assigned > 1 ? "s" : ""} will become unassigned.`
    : `Delete agent "${a.name}"?`;
  if (!confirm(msg)) return;
  delete app.agents[aid];
  for (const gid of app.groupOrder) {
    if (app.groups[gid].agentId === aid) app.groups[gid].agentId = null;
  }
  save(); render();
  toast("Agent deleted");
}

function regenerateAgentToken(aid) {
  if (!isMaster()) { toast("Master access required"); return; }
  const a = app.agents[aid];
  if (!a) return;
  if (!confirm("Generate a new personal link? The agent's old link will stop working.")) return;
  a.token = genToken();
  save(); render();
  showAgentLinkDialog(aid);
  toast("New link generated");
}

function showAgentLinkDialog(aid) {
  const a = app.agents[aid];
  if (!a) return;
  const link = buildAgentLink(aid);
  const old = document.getElementById('linkDialog');
  if (old) old.remove();
  const html = `
    <dialog id="linkDialog">
      <div class="dlg-head">
        <h3>${esc(a.name)} — personal link</h3>
        <p>Share with the agent so they can sign in</p>
      </div>
      <div class="dlg-body">
        <div class="field">
          <label>Personal link</label>
          <textarea id="linkText" readonly rows="3" style="width:100%;font-family:ui-monospace,monospace;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;resize:none">${esc(link)}</textarea>
          <div class="hint">Anyone with this link can sign in as ${esc(a.name)}. Keep it private.</div>
        </div>
        <div class="detect-actions" style="margin-top:0">
          <button type="button" class="btn sm" data-action="copy-agent-link" data-aid="${esc(aid)}">📋 Copy link</button>
          ${a.phone ? `<button type="button" class="btn sm wa" data-action="send-agent-link" data-aid="${esc(aid)}">💬 WhatsApp</button>` : ''}
          <button type="button" class="btn sm" data-action="regen-agent-link" data-aid="${esc(aid)}">🔄 New link</button>
        </div>
      </div>
      <div class="dlg-foot">
        <button type="button" class="btn primary" onclick="this.closest('dialog').close()">Done</button>
      </div>
    </dialog>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('linkDialog').showModal();
}

function copyAgentLink(aid) {
  const link = buildAgentLink(aid);
  if (!link) { toast("No link"); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(
      () => toast("Link copied"),
      () => toast("Copy failed — select manually")
    );
  } else {
    toast("Clipboard unavailable — select manually");
  }
}

function sendAgentLinkWhatsApp(aid) {
  const a = app.agents[aid];
  if (!a || !a.phone) { toast("No phone"); return; }
  const link = buildAgentLink(aid);
  const text = `Hi ${a.name.split(' ')[0]} 👋\n\nYour personal Susu login link:\n\n${link}\n\nOpen it to sign in to your circles. Keep it private — don't share.`;
  const url = `https://wa.me/${digits(a.phone)}?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
}

function assignAgentToGroup(gid, aid) {
  if (!isMaster()) { toast("Master access required"); return; }
  const g = app.groups[gid];
  if (!g) return;
  g.agentId = (aid && app.agents[aid]) ? aid : null;
  save();
  render();
  toast(g.agentId ? `Assigned to ${app.agents[g.agentId].name}` : "Unassigned");
}

function changeMasterPin() {
  if (!isMaster()) return;
  const oldPin = (document.getElementById("oldPin").value || "").trim();
  const newPin = (document.getElementById("newPin").value || "").trim();
  const confirmPin = (document.getElementById("confirmPin").value || "").trim();
  if (simpleHash(oldPin) !== app.master.pin) { toast("Current PIN incorrect"); return; }
  if (!newPin || newPin.length < 4) { toast("New PIN must be at least 4 characters"); return; }
  if (newPin !== confirmPin) { toast("PINs don't match"); return; }
  app.master.pin = simpleHash(newPin);
  save(); render();
  toast("Master PIN changed");
}

function changeAgentOwnPin() {
  if (!isAgent()) return;
  const a = currentAgent();
  const oldPin = (document.getElementById("agentOldPin").value || "").trim();
  const newPin = (document.getElementById("agentNewPin").value || "").trim();
  const confirmPin = (document.getElementById("agentConfirmPin").value || "").trim();
  if (!a.pin || simpleHash(oldPin) !== a.pin) { toast("Current PIN incorrect"); return; }
  if (!newPin || newPin.length < 4) { toast("New PIN must be at least 4 characters"); return; }
  if (newPin !== confirmPin) { toast("PINs don't match"); return; }
  a.pin = simpleHash(newPin);
  save(); render();
  toast("PIN changed");
}

/* ═══════════════════════════════════════════════════════════════════
   16. MAIN RENDER
   ═══════════════════════════════════════════════════════════════════ */
function render() {
  if (!session) {
    renderLogin();
    return;
  }
  hideLogin();

  // Master tab visibility
  const masterTab = document.querySelector('.tab[data-view="master"]');
  if (masterTab) masterTab.hidden = !isMaster();
  if (isAgent() && view === 'master') view = 'home';

  if (isAgent()) {
    ensureActiveGroupVisible();
    if (visibleGroupIds().length === 0) {
      renderAgentNoCircles();
      return;
    }
  }

  document.getElementById("groupName").textContent = state.group.name;
  document.title = state.group.name + " · Susu";
  const amt = currentAmount();
  document.getElementById("groupSub").textContent =
    `${members().length} members · ${money(amt)} ${state.group.frequency.toLowerCase()}`;
  document.getElementById("cycleNum").textContent = state.cycle;

  const agentLabel = document.getElementById("agentLabel");
  if (isAgent()) {
    agentLabel.textContent = currentAgent().name + " (agent)";
    agentLabel.hidden = false;
  } else if (isMaster() && state.agentId && app.agents[state.agentId]) {
    agentLabel.textContent = app.agents[state.agentId].name;
    agentLabel.hidden = false;
  } else {
    agentLabel.hidden = true;
  }

  renderHome();
  renderPeople();
  renderSettings();
  if (isMaster()) renderMaster();
  else document.getElementById("view-master").innerHTML = "";
  setTab(view);
  updateStatusUI();
}

function setTab(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(t => {
    if (t.hidden) return;
    t.classList.toggle("active", t.dataset.view === v);
  });
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("active", el.id === "view-" + v));
  const masterTab = document.querySelector('.tab[data-view="master"]');
  if (masterTab && isMaster()) {
    masterTab.classList.toggle("master-tab", view !== "master");
  }
}

function renderAgentNoCircles() {
  document.getElementById("groupName").textContent = "No circles";
  document.getElementById("groupSub").textContent = "Assigned by master";
  document.getElementById("cycleNum").textContent = "—";
  document.getElementById("agentLabel").textContent = currentAgent().name + " (agent)";
  document.getElementById("agentLabel").hidden = false;
  const html = `
    <div class="card">
      <div class="empty">
        <span class="emoji">📭</span>
        <div style="font-weight:600;color:var(--ink);margin-bottom:4px">No circles yet</div>
        <div>You don't have any circles assigned.</div>
        <button class="btn primary" data-action="new-group" style="margin-top:16px">Create my first circle</button>
        <div style="margin-top:16px">
          <button class="btn ghost sm" data-action="sign-out">Sign out</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("view-home").innerHTML = html;
  document.getElementById("view-people").innerHTML = "";
  document.getElementById("view-settings").innerHTML = "";
  setTab('home');
}

function renderHistory() {
  const payouts = state.payouts || [];
  if (!payouts.length) {
    return `<div class="card">
      <h2 class="card-title">Payout history</h2>
      <div class="payout-empty">No payouts yet — close your first cycle to see it here.</div>
    </div>`;
  }
  const totalPaidOut = payouts.reduce((s, p) => s + (+p.amount || 0), 0);
  const totalFees = payouts.reduce((s, p) => s + (+p.managementFee || 0), 0);
  const sorted = payouts.slice().sort((a, b) => {
    const dc = (b.cycle || 0) - (a.cycle || 0);
    if (dc !== 0) return dc;
    return String(b.date || "").localeCompare(String(a.date || ""));
  });
  const rows = sorted.map(p => {
    const m = state.members.find(x => x.id === p.memberId);
    const name = (m && m.name) || p.memberName || "Removed member";
    const isRemoved = !m;
    const date = p.date ? fmtDate(p.date) : "—";
    const colorSeed = p.memberId || name;
    const cycleLabel = p.cycle ? `Cycle ${p.cycle}` : "Payout";
    const feeNote = p.managementFee > 0
      ? ` · fee ${money(p.managementFee)} (${p.feePercent}%)`
      : "";
    return `<div class="payout-row">
      <span class="payout-cycle">${esc(cycleLabel)}</span>
      <div class="payout-who">
        <div class="avatar${avatarColor(colorSeed)}">${esc(initials(name))}</div>
        <div class="who-text">
          <div class="payout-name${isRemoved ? " removed" : ""}">${esc(name)}</div>
          <div class="payout-date">${esc(date)}${esc(feeNote)}</div>
        </div>
      </div>
      <span class="payout-amt">${money(p.amount)}</span>
    </div>`;
  }).join("");
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;
      margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <h2 class="card-title" style="margin:0">Payout history · ${payouts.length}</h2>
      <span style="font-size:12.5px;color:var(--muted)">Paid out ${money(totalPaidOut)}${totalFees > 0 ? ` · fees ${money(totalFees)}` : ""}</span>
    </div>
    <div class="payout-list">${rows}</div>
  </div>`;
}

function renderHome() {
  const list = members();
  const total = list.length;
  const payers = list.filter(m => !isExempt(m));
  const paid = payers.filter(m => isPaid(m, state.cycle)).length;
  const pct = payers.length ? Math.round(paid / payers.length * 100) : 0;
  const unpaid = payers.filter(m => !isPaid(m, state.cycle));
  const next = nextPerson();
  const allPaid = payers.length > 0 && paid === payers.length;
  const due = fmtDate(cycleEnd(state.cycle));
  const feePct = feePercent();
  const grossAmt = grossPayoutAmt();
  const feeAmt = Math.round(grossAmt * feePct / 100);

  const btnHtml = total === 0
    ? `<button class="hero-btn" data-action="add">Add members</button>`
    : allPaid
      ? `<button class="hero-btn" data-action="close">Close cycle →</button>`
      : `<button class="hero-btn" disabled>Waiting · ${paid}/${payers.length}</button>`;

  const unpaidHtml = unpaid.length ? `
    <div class="card" style="padding-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;
        margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <h2 class="card-title" style="margin:0">Waiting on ${unpaid.length}</h2>
        <span style="font-size:12.5px;color:var(--muted)">Due ${due}</span>
      </div>
      <div class="unpaid-list">
        ${unpaid.map(m => `
          <div class="unpaid-row">
            <div class="avatar${avatarColor(m.id)}">${esc(initials(m.name))}</div>
            <div class="who">
              <div class="name">${esc(m.name)}</div>
              <div class="ph">${m.phone ? esc(m.phone) : "no number"}</div>
            </div>
            <div class="actions">
              ${m.phone ? `<button class="btn wa sm" data-action="wa" data-id="${esc(m.id)}" data-kind="remind" title="Send reminder">💬</button>` : ""}
              <button class="btn sm" data-action="paid" data-id="${esc(m.id)}">Paid</button>
            </div>
          </div>
        `).join("")}
      </div>
      ${unpaid.length > 1 ? `
        <button class="btn primary block" data-action="bulk-paid" style="margin-top:14px">
          Mark all ${unpaid.length} paid
        </button>
      ` : ""}
    </div>
  ` : "";

  const nextHtml = next ? `
    <div class="card">
      <h2 class="card-title">Up next</h2>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div class="avatar${avatarColor(next.id)}" style="width:48px;height:48px;font-size:16px">${esc(initials(next.name))}</div>
        <div style="flex:1;min-width:140px">
          <div style="font-weight:600;font-size:16px">${esc(next.name)}</div>
          <div style="font-size:13px;color:var(--muted)">${next.phone ? esc(next.phone) : "no number"}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:700;letter-spacing:-.02em">${money(payoutAmt())}</div>
          ${feePct > 0 ? `<div style="font-size:11px;color:var(--muted)">net of ${feePct}% fee (${money(feeAmt)})</div>` : ""}
        </div>
      </div>
    </div>
  ` : "";

  const paybillHtml = state.group.paybill ? `
    <div class="pay-footer">
      <div>
        <div class="lbl">Pay to</div>
        <div class="num">${esc(state.group.paybill)}</div>
      </div>

function currencyOptions(selectedCode) {
  return Array.from(VALID_CURRENCIES).sort().map(c => {
    const isSel = (selectedCode === c) ? "selected" : "";
    let label = c;
    try {
      if (typeof Intl.DisplayNames === "function") {
        const name = new Intl.DisplayNames([LOCALE], { type: "currency" }).of(c);
        if (name && name !== c) label = `${c} · ${name}`;
      }
    } catch (e) {}
    return `<option value="${c}" ${isSel}>${esc(label)}</option>`;
  }).join("");
}

function storageLabel(mode) {
  if (mode === "indexeddb") return '<span class="status-chip ok">IndexedDB</span>';
  if (mode === "localstorage") return '<span class="status-chip ok">LocalStorage</span>';
  if (mode === "memory") return '<span class="status-chip err">Memory only</span>';
  return '<span class="status-chip info">Detecting…</span>';
}

document.addEventListener("click", e => {
  const loginTab = e.target.closest("[data-login-tab]");
  if (loginTab && !loginTab.disabled) {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.toggle('active', t === loginTab));
    document.getElementById('loginMasterPane').hidden = loginTab.dataset.loginTab !== 'master';
    document.getElementById('loginAgentPane').hidden = loginTab.dataset.loginTab !== 'agent';
    return;
  }

  const tab = e.target.closest(".tab");
  if (tab && !tab.hidden) {
    if (tab.dataset.view === 'master' && !isMaster()) return;
    setTab(tab.dataset.view);
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }

  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const { action, id, kind, gid, aid } = btn.dataset;
  switch (action) {
    // Auth
    case "setup-master": setupMaster(); break;
    case "login-master": loginMaster(); break;
    case "login-agent-pin": loginAgentByPin(); break;
    case "login-agent-link": loginAgentByLink(); break;
    case "sign-out": signOut(); break;
    case "reset-data": resetAppData(); break;
    // Members
    case "add": openMember(null); break;
    case "edit": openMember(id); break;
    case "remove": removeMember(id); break;
    case "paid": togglePaid(id); break;
    case "bulk-paid": bulkMarkPaid(); break;
    case "up": moveMember(id, -1); break;
    case "down": moveMember(id, 1); break;
    case "close": closeCycle(); break;
    case "wa": {
      const m = state.members.find(x => x.id === id);
      if (m) openWhatsApp(m, kind || "remind");
      break;
    }
    // Settings
    case "save-settings": saveSettings(); break;
    case "toggle-auto-receipt": toggleAutoReceipt(btn); break;
    case "re-detect": reDetect(); break;
    case "reset-current": resetCurrentGroup(); break;
    case "load-demo": loadDemo(); break;
    case "export-backup": exportBackup(); break;
    case "import-backup": triggerImport(); break;
    case "enable-auto-save": pickSaveFile(); break;
    case "disable-auto-save": disableAutoSaveFile(); break;
    case "change-agent-pin": changeAgentOwnPin(); break;
    // Groups
    case "open-groups": openGroupPicker(); break;
    case "close-groups": closeGroupDialog(); break;
    case "new-group": newGroup(); break;
    case "switch-group": switchGroup(gid); break;
    case "rename-group": renameGroup(gid); break;
    case "delete-group": deleteGroup(gid); break;
    // Master
    case "new-agent": newAgent(); break;
    case "edit-agent": editAgent(aid); break;
    case "delete-agent": deleteAgent(aid); break;
    case "show-agent-link": showAgentLinkDialog(aid); break;
    case "copy-agent-link": copyAgentLink(aid); break;
    case "send-agent-link": sendAgentLinkWhatsApp(aid); break;
    case "regen-agent-link": regenerateAgentToken(aid); break;
    case "change-master-pin": changeMasterPin(); break;
  }
});

/* ═══════════════════════════════════════════════════════════════════
   18. PWA
   ═══════════════════════════════════════════════════════════════════ */
(function setupPWA() {
  const iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#16a34a"/><text x="96" y="132" font-size="100" text-anchor="middle" fill="white" font-family="system-ui,sans-serif">◎</text></svg>';
  const manifest = {
    name: APP_TITLE, short_name: "Susu", start_url: ".", scope: ".",
    display: "standalone", orientation: "portrait",
    background_color: "#f7f8fa", theme_color: "#16a34a",
    icons: [{ src: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSvg),
              sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" }]
  };
  try {
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
    const apple = document.createElement("link");
    apple.rel = "apple-touch-icon";
    apple.href = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSvg);
    document.head.appendChild(apple);
  } catch (e) {}
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();

/* ═══════════════════════════════════════════════════════════════════
   19. BOOT
   ═══════════════════════════════════════════════════════════════════ */
(async () => {
  try {
    await Storage.init();
    await loadState();

    // URL hash auto-login
    const linkAuth = parseAgentHash(location.hash);
    if (linkAuth) {
      const agent = app.agents[linkAuth.agentId];
      if (agent && agent.token === linkAuth.token) {
        setSession({ role: 'agent', agentId: linkAuth.agentId });
        ensureActiveGroupVisible();
        stripHash();
      } else {
        stripHash();
        setTimeout(() => toast("Invalid or expired agent link"), 600);
      }
    }

    // Resume saved session
    session = getSession();
    if (session) {
      if (session.role === 'agent' && !app.agents[session.agentId]) clearSession();
      if (session.role === 'master' && !app.master.pin) clearSession();
      session = getSession();
    }

    ensureCycleOrder();
    if (isAgent()) ensureActiveGroupVisible();
    render();
    setInterval(updateStatusUI, 30000);

    if (Storage.getMode() === "memory" && IS_FILE) {
      setTimeout(() => toast("file:// — export a backup or enable auto-save"), 1200);
    }
  } catch (e) {
    console.error("Boot failed:", e);
    app = blankApp();
    state = app.groups[app.activeGroupId];
    formatter = makeMoneyFormatter(LOCALE, state.group.currency);
    try { render(); } catch (_) {}
    toast("Recovered from startup error");
  }
})();
</script>
