<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Susu">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%2316a34a"/><text x="50" y="68" font-size="56" text-anchor="middle" fill="white" font-family="system-ui,sans-serif">◎</text></svg>'>
<title>Susu</title>
<style>
  :root{
    --bg:#f7f8fa;--card:#fff;--ink:#1f2937;--muted:#6b7280;--soft:#9ca3af;
    --line:#e5e7eb;--green:#16a34a;--green-dark:#15803d;--green-soft:#f0fdf4;
    --amber:#d97706;--amber-soft:#fffbeb;--red:#dc2626;--red-soft:#fef2f2;
    --blue:#2563eb;--blue-soft:#eff6ff;--purple:#7c3aed;--purple-soft:#f5f3ff;
    --r:16px;--shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}
  @media(max-width:600px){.wrap{padding:0 14px}}

  header{padding:24px 0 12px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
  .logo{width:44px;height:44px;border-radius:14px;flex:none;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    display:grid;place-items:center;font-size:22px;color:#fff;
    box-shadow:0 4px 12px -4px rgba(22,163,74,.5)}
  .title{min-width:0;flex:1}
  .title-btn{appearance:none;border:0;background:transparent;padding:0;margin:0;
    font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;
    max-width:100%;text-align:left;border-radius:8px}
  .title-btn:hover .title-caret{color:var(--green)}
  .title-btn #groupName{font-size:20px;font-weight:700;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .title-caret{font-size:11px;color:var(--muted);flex:none;transition:color .15s}
  .title p{margin:2px 0 0;font-size:13px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agent-label{display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:600;margin-top:4px;
    background:var(--purple-soft);color:var(--purple);
    padding:2px 9px;border-radius:99px}
  .agent-label[hidden]{display:none}
  .agent-label::before{content:"👤";font-size:10px}
  .cycle-badge{background:#fff;border:1px solid var(--line);padding:8px 14px;
    border-radius:99px;font-size:13px;font-weight:600;box-shadow:var(--shadow);
    white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
  .cycle-badge span{color:var(--green);font-size:15px}
  .net-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--green);transition:.2s;flex:none}
  .net-dot.offline{background:var(--amber)}
  .net-dot.memory{background:var(--red);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  nav{padding:8px 0 20px}
  .tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);
    padding:4px;border-radius:14px;box-shadow:var(--shadow)}
  .tab{flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:14px;font-weight:600;color:var(--muted);
    padding:11px 8px;border-radius:10px;transition:.15s;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--green);color:#fff;box-shadow:0 2px 8px -2px rgba(22,163,74,.4)}
  .tab.active.master-tab{background:var(--purple);box-shadow:0 2px 8px -2px rgba(124,58,237,.4)}
  .tab[hidden]{display:none}

  main{padding-bottom:60px}
  .view{display:none}
  .view.active{display:block}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
  @media(max-width:600px){.card{padding:18px}}
  .card-title{font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin:0 0 12px}

  .warn-banner{background:var(--red-soft);border:1px solid #fecaca;border-radius:12px;
    padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--red)}
  .warn-banner[hidden]{display:none}
  .warn-banner strong{font-weight:700}

  .hero{background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff;border-radius:var(--r);padding:26px;
    box-shadow:0 12px 32px -16px rgba(22,163,74,.6);margin-bottom:16px}
  @media(max-width:600px){.hero{padding:22px 18px}}
  .hero-top{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .hero-top .label{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}
  .hero-top .value{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .hero-top .value small{font-size:16px;opacity:.75;font-weight:500}
  .hero-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.2);
    overflow:hidden;margin-bottom:14px}
  .hero-bar > i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s ease}
  .hero-info{display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;font-size:14px}
  .hero-info .meta{color:rgba(255,255,255,.85)}
  .hero-btn{appearance:none;border:0;cursor:pointer;font:inherit;background:#fff;
    color:var(--green-dark);font-weight:700;padding:10px 18px;border-radius:10px;
    font-size:14px;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .hero-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .hero-btn:disabled{opacity:.55;cursor:not-allowed;
    background:rgba(255,255,255,.25);color:#fff;box-shadow:none}

  .unpaid-list{display:flex;flex-direction:column;gap:8px}
  .unpaid-row{display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:#fff;border:1px solid var(--line);border-radius:12px;transition:.15s}
  .unpaid-row:hover{border-color:#d1d5db;background:#fafbfc}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;
    display:grid;place-items:center;font-size:13px;font-weight:700;
    color:#fff;background:var(--green)}
  .avatar.c1{background:#16a34a}.avatar.c2{background:#0891b2}
  .avatar.c3{background:#7c3aed}.avatar.c4{background:#db2777}
  .avatar.c5{background:#ea580c}.avatar.c6{background:#0284c7}
  .unpaid-row .who{flex:1;min-width:0}
  .unpaid-row .who .name{font-weight:600;font-size:15px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unpaid-row .who .ph{font-size:12.5px;color:var(--muted)}
  .unpaid-row .actions{display:flex;gap:6px;flex-wrap:wrap}

  .btn{appearance:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:#fff;
    color:var(--ink);transition:.15s;display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;white-space:nowrap}
  .btn:hover{background:#f9fafb;border-color:#d1d5db}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
  .btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}
  .btn.purple:hover{background:#6d28d9;border-color:#6d28d9}
  .btn.wa{background:#25d366;border-color:#25d366;color:#fff}
  .btn.wa:hover{background:#1eb959;border-color:#1eb959}
  .btn.ghost{background:transparent;border:0;color:var(--soft);padding:8px 10px}
  .btn.ghost:hover{background:#f3f4f6;color:var(--ink)}
  .btn.danger{color:var(--red);border-color:#fecaca;background:var(--red-soft)}
  .btn.danger:hover{background:#fee2e2}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .btn.block{width:100%;justify-content:center;padding:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .people{display:flex;flex-direction:column;gap:10px}
  .person{display:flex;align-items:center;gap:14px;padding:14px;
    background:#fff;border:1px solid var(--line);border-radius:14px;transition:.15s}
  .person:hover{border-color:#d1d5db}
  .person .avatar{width:44px;height:44px;font-size:14px}
  .person .info{flex:1;min-width:0}
  .person .info .name{font-weight:600;font-size:15.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person .info .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .person .info .status{display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:6px}
  .status.paid{background:var(--green-soft);color:var(--green-dark)}
  .status.unpaid{background:var(--amber-soft);color:var(--amber)}
  .status.next{background:var(--blue-soft);color:var(--blue)}
  .status.exempt{background:#f3f4f6;color:var(--muted)}
  .person-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

  .toggle{width:48px;height:28px;border-radius:99px;border:0;background:#d1d5db;
    cursor:pointer;position:relative;transition:.2s;flex:none}
  .toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on{background:var(--green)}
  .toggle.on::after{left:calc(100% - 25px)}
  .toggle:disabled{opacity:.4;cursor:not-allowed}
  .toggle:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);
    font-size:14.5px;line-height:1.6}
  .empty .emoji{font-size:36px;display:block;margin-bottom:8px}

  .payout-list{display:flex;flex-direction:column;margin:0 -6px}
  .payout-row{display:flex;align-items:center;gap:12px;padding:11px 6px;
    border-top:1px solid var(--line);font-size:14px;transition:.15s}
  .payout-row:first-child{border-top:0;padding-top:2px}
  .payout-row:last-child{padding-bottom:2px}
  .payout-cycle{font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;min-width:56px;flex:none}
  .payout-who{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
  .payout-who .avatar{width:30px;height:30px;font-size:11px}
  .payout-who .who-text{min-width:0;flex:1}
  .payout-name{font-weight:600;font-size:14.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .payout-name.removed{color:var(--muted);font-style:italic;font-weight:500}
  .payout-date{font-size:11.5px;color:var(--muted);margin-top:1px}
  .payout-amt{font-weight:700;font-variant-numeric:tabular-nums;
    font-size:14.5px;white-space:nowrap;color:var(--ink)}
  .payout-empty{text-align:center;padding:22px 12px;color:var(--muted);
    font-size:13.5px;line-height:1.5}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;
    border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green);
    box-shadow:0 0 0 3px rgba(22,163,74,.12)}
  .field .hint{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:400}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.field-row{grid-template-columns:1fr}}

  .toggle-card{display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:16px;padding:12px 14px;background:#fafbfc;
    border:1px solid var(--line);border-radius:12px}
  .toggle-card .tc-text{flex:1;min-width:0}
  .toggle-card .tc-title{font-size:13px;font-weight:600;color:var(--ink)}
  .toggle-card .tc-hint{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}

  .pay-footer{background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:16px 20px;box-shadow:var(--shadow);display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .pay-footer .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;font-weight:600}
  .pay-footer .num{font-size:18px;font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .pay-footer .num.empty{color:var(--soft);font-size:14px;font-weight:500;font-family:inherit}

  .detect-panel{background:#fafbfc;border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:16px}
  .detect-row{display:flex;justify-content:space-between;align-items:center;
    gap:12px;padding:8px 0;font-size:14px;border-bottom:1px dashed #eef0f3;flex-wrap:wrap}
  .detect-row:last-child{border-bottom:0}
  .detect-row .k{color:var(--muted);font-weight:500}
  .detect-row .v{font-weight:600;color:var(--ink);text-align:right;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13.5px}
  .detect-row .v.auto{color:var(--green-dark)}
  .detect-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  .status-chip{display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.05em}
  .status-chip.ok{background:var(--green-soft);color:var(--green-dark)}
  .status-chip.warn{background:var(--amber-soft);color:var(--amber)}
  .status-chip.err{background:var(--red-soft);color:var(--red)}
  .status-chip.info{background:var(--blue-soft);color:var(--blue)}
  .status-chip.purple{background:var(--purple-soft);color:var(--purple)}

  .group-list{display:flex;flex-direction:column}
  .group-row{display:flex;align-items:center;gap:6px;padding:12px 4px;
    border-bottom:1px solid var(--line)}
  .group-row:first-child{padding-top:4px}
  .group-row:last-child{border-bottom:0;padding-bottom:4px}
  .group-row.active .group-name{color:var(--green-dark)}
  .group-pick{flex:1;text-align:left;background:transparent;border:0;cursor:pointer;
    font:inherit;color:inherit;padding:6px 4px;min-width:0;border-radius:8px}
  .group-pick:hover{background:#f9fafb}
  .group-name{font-weight:600;font-size:15px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .group-meta{font-size:12.5px;color:var(--muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .group-check{color:var(--green);font-weight:700;font-size:16px;flex:none;
    width:20px;text-align:center}
  .group-agent{font-size:11px;font-weight:600;color:var(--purple);
    background:var(--purple-soft);padding:2px 7px;border-radius:99px;margin-left:4px}

  /* Master dashboard */
  .fee-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
  @media(max-width:520px){.fee-stats{grid-template-columns:1fr 1fr}}
  .fee-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .fee-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;font-weight:700;margin-bottom:4px}
  .fee-stat .val{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .fee-stat .val.settled{color:var(--green-dark)}
  .fee-stat .val.pending{color:var(--amber)}

  .agent-row{display:flex;align-items:center;gap:8px;padding:12px 0;
    border-top:1px solid var(--line);flex-wrap:wrap}
  .agent-row:first-child{border-top:0;padding-top:4px}
  .agent-row .avatar{width:40px;height:40px;font-size:13px;background:var(--purple)}
  .agent-row .info{flex:1;min-width:140px}
  .agent-row .name{font-weight:600;font-size:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agent-row .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
  .agent-row .fees{font-size:14px;font-weight:700;color:var(--green-dark);
    text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

  .circle-row{display:flex;align-items:center;gap:10px;padding:10px 0;
    border-top:1px solid var(--line);flex-wrap:wrap}
  .circle-row:first-child{border-top:0;padding-top:2px}
  .circle-row .info{flex:1;min-width:140px}
  .circle-row .name{font-weight:600;font-size:14.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .circle-row .meta{font-size:11.5px;color:var(--muted);margin-top:1px}
  .circle-row .fees{font-size:13.5px;font-weight:700;color:var(--green-dark);
    font-variant-numeric:tabular-nums}
  .circle-row select{padding:6px 10px;font-size:12.5px;font-family:inherit;
    border:1px solid var(--line);border-radius:8px;background:#fff;
    color:var(--ink);cursor:pointer}

  /* Login screen */
  #loginScreen{
    position:fixed;inset:0;background:var(--bg);z-index:1000;overflow-y:auto;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #loginScreen[hidden]{display:none !important}
  .login-card{
    width:100%;max-width:380px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px -30px rgba(0,0,0,.2);
  }
  .login-logo{
    width:64px;height:64px;border-radius:20px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    display:grid;place-items:center;font-size:34px;color:#fff;
    box-shadow:0 8px 24px -8px rgba(22,163,74,.5);
  }
  .login-card h1{margin:0 0 4px;font-size:22px;font-weight:700;text-align:center}
  .login-card > p{margin:0 0 24px;font-size:13.5px;color:var(--muted);text-align:center;line-height:1.5}
  .login-tabs{
    display:flex;gap:4px;background:#f7f8fa;border:1px solid var(--line);
    padding:4px;border-radius:12px;margin-bottom:20px;
  }
  .login-tab{
    flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
    padding:9px 8px;border-radius:8px;transition:.15s;white-space:nowrap;
  }
  .login-tab:hover:not(:disabled){color:var(--ink)}
  .login-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .login-tab:disabled{opacity:.4;cursor:not-allowed}
  .login-hint{font-size:12px;color:var(--muted);text-align:center;margin:16px 0 0;line-height:1.5}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,20px);background:#111827;color:#fff;
    padding:12px 22px;border-radius:99px;font-size:14px;font-weight:500;
    opacity:0;pointer-events:none;transition:.25s;z-index:2000;max-width:92vw;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:10px;justify-content:center}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast span{text-align:center}
  .toast-btn{background:transparent;border:1px solid rgba(255,255,255,.5);
    color:#fff;padding:5px 11px;border-radius:99px;font:inherit;font-size:13px;
    font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
  .toast-btn:hover{background:rgba(255,255,255,.15)}

  dialog{border:0;border-radius:18px;padding:0;width:min(440px,92vw);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4);background:#fff}
  dialog::backdrop{background:rgba(17,24,39,.45);backdrop-filter:blur(2px)}
  .dlg-head{padding:24px 24px 0}
  .dlg-head h3{margin:0;font-size:20px;font-weight:700}

/* ═══════════════════════════════════════════════════════════════════
   1. STORAGE LAYER
   ═══════════════════════════════════════════════════════════════════ */
const Storage = (() => {
  let mode = "unknown";
  let db = null;
  const mem = {};

  async function init() {
    try {
      localStorage.setItem("__probe__", "1");
      localStorage.removeItem("__probe__");
      mode = "localstorage";
      return mode;
    } catch (e) { console.warn("localStorage unavailable:", e.name || e.message); }
    try {
      await openIDB();
      mode = "indexeddb";
      return mode;
    } catch (e) { console.warn("IndexedDB unavailable:", e.message); }
    mode = "memory";
    return mode;
  }

  function openIDB() {
    return new Promise((resolve, reject) => {
      if (!("indexedDB" in window)) return reject(new Error("No IndexedDB"));
      let settled = false;
      const req = indexedDB.open("susu-db", 1);
      req.onupgradeneeded = ev => {
        const d = ev.target.result;
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      };
      req.onsuccess = ev => {
        if (settled) return;
        settled = true;
        db = ev.target.result;
        db.onversionchange = () => { try { db.close(); } catch (_) {} db = null; };
        resolve();
      };
      req.onerror = () => { if (!settled) { settled = true; reject(req.error || new Error("IDB error")); } };
      req.onblocked = () => { if (!settled) { settled = true; reject(new Error("Blocked")); } };
      setTimeout(() => { if (!settled) { settled = true; reject(new Error("Timeout")); } }, 3000);
    });
  }

  async function get(key) {
    if (mode === "localstorage") {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    if (mode === "indexeddb" && db) {
      return new Promise((resolve) => {
        try {
          const tx = db.transaction("kv", "readonly");
          const r = tx.objectStore("kv").get(key);
          r.onsuccess = () => resolve(r.result ?? null);
          r.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }
    return mem[key] ?? null;
  }

  async function set(key, value) {
    if (mode === "localstorage") {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        console.warn("localStorage write failed, upgrading:", e.name);
        try { await openIDB(); mode = "indexeddb"; return set(key, value); }
        catch (_) { mode = "memory"; mem[key] = value; return false; }
      }
    }
    if (mode === "indexeddb" && db) {
      return new Promise((resolve) => {
        try {
          const tx = db.transaction("kv", "readwrite");
          tx.objectStore("kv").put(value, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => { mode = "memory"; mem[key] = value; resolve(false); };
        } catch (e) { mode = "memory"; mem[key] = value; resolve(false); }
      });
    }
    mem[key] = value;
    return false;
  }

  function setSync(key, value) {
    if (mode === "localstorage") {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) {}
    }
    if (mode === "indexeddb" && db) {
      try {
        const tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(value, key);
        return true;
      } catch (e) {}
    }
    mem[key] = value;
    return false;
  }

  return { init, get, set, setSync, getMode: () => mode };
})();

function detectCurrencyZone() {
  let locale = "en-US", tz = "UTC";
  try {
    const opts = Intl.DateTimeFormat().resolvedOptions();
    if (opts.locale) locale = opts.locale;
    if (opts.timeZone) tz = opts.timeZone;
  } catch (e) {}

  let region = "";
  try {
    const loc = new Intl.Locale(locale);
    if (loc.region) region = String(loc.region).toUpperCase();
  } catch (e) {
    const parts = String(locale).split(/[-_]/);
    if (parts[1] && /^[A-Za-z]{2}$/.test(parts[1])) region = parts[1].toUpperCase();
  }
  if (!region && TIMEZONE_TO_COUNTRY[tz]) region = TIMEZONE_TO_COUNTRY[tz];
  if (!region) {
    try {
      const loc = new Intl.Locale(locale).maximize();
      if (loc.region) region = String(loc.region).toUpperCase();
    } catch (e) {}
  }

  const currency = COUNTRY_TO_CURRENCY[region] || "USD";
  let countryName = "";
  try {
    if (region && typeof Intl.DisplayNames === "function") {
      countryName = new Intl.DisplayNames([locale], { type: "region" }).of(region) || "";
    }
  } catch (e) {}

  return { locale, tz, region, country: countryName, currency, dial: DIAL_BY_COUNTRY[region] || "" };
}
const ZONE = detectCurrencyZone();

/* ═══════════════════════════════════════════════════════════════════
   3. MONEY / DATE / PHONE HELPERS
   ═══════════════════════════════════════════════════════════════════ */
function makeMoneyFormatter(locale, code) {
  try {
    const f = new Intl.NumberFormat(locale, {
      style: "currency", currency: code,
      maximumFractionDigits: 0, currencyDisplay: "narrowSymbol"
    });
    f.format(0);
    return f;
  } catch (e) {
    try { return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }); }
    catch (e2) { return { format: n => String(Math.round(n)) }; }
  }
}
function getCurrencySymbol(locale, code) {
  try {
    const parts = new Intl.NumberFormat(locale, {
      style: "currency", currency: code, currencyDisplay: "narrowSymbol"
    }).formatToParts(0);
    const sym = parts.find(p => p.type === "currency");
    return sym ? sym.value : code;
  } catch (e) { return code; }
}

function simpleHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}

function genToken() {
  try {
    if (crypto && crypto.getRandomValues) {
      const a = new Uint8Array(16);
      crypto.getRandomValues(a);
      return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}

const CYCLE_DAYS = { "Daily":1, "Weekly":7, "Bi-weekly":14, "Monthly":30 };
const isoDate = (d = new Date()) => {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
};
function parseDate(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) { const d = new Date(s); return isNaN(d) ? null : d; }
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d) ? null : d;
}
function fmtDate(v) {
  if (!v) return "—";
  const d = typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) ? parseDate(v) : new Date(v);
  if (!d || isNaN(d)) return "—";
  try { return new Intl.DateTimeFormat(LOCALE,{month:"short",day:"numeric",year:"numeric",timeZone:ZONE.tz}).format(d); }
  catch (e) { return d.toDateString(); }
}
function fmtDateTime(v) {
  if (!v) return "—";
  const d = v instanceof Date ? v : new Date(v);
  if (isNaN(d)) return "—";
  try { return new Intl.DateTimeFormat(LOCALE,{dateStyle:"medium",timeStyle:"short",timeZone:ZONE.tz}).format(d); }
  catch (e) { return d.toLocaleString(); }
}
function addDays(iso, n) {
  const d = parseDate(iso); if (!d) return iso;
  d.setDate(d.getDate() + n); return isoDate(d);
}

const digits = s => String(s || "").replace(/\D/g,"");
function normalizePhone(raw, dial) {
  if (!raw) return "";
  let s = String(raw).trim();
  if (!s) return "";
  const plus = s.startsWith("+");
  s = s.replace(/\D/g,"");
  if (!s) return "";
  if (plus) return "+" + s;
  if (s.startsWith("00")) return "+" + s.slice(2);
  const d = dial || ZONE.dial;
  if (d) {
    if (s.startsWith(d) && s.length >= d.length + 6) return "+" + s;
    if (s.startsWith("0")) return "+" + d + s.slice(1);
    return "+" + d + s;
  }
  return "+" + s;
}

const initials = n => String(n||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
const avatarColor = id => {
  let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) % 6;
  return h === 0 ? "" : " c" + (h+1);
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let session = null;   // { role: 'master' } | { role: 'agent', agentId } | null

function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setSession(s) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
  session = s;
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  session = null;
}
function isMaster() { return !!(session && session.role === 'master'); }
function isAgent() { return !!(session && session.role === 'agent' && app && app.agents[session.agentId]); }
function currentAgent() { return isAgent() ? app.agents[session.agentId] : null; }

function visibleGroupIds() {
  if (!app) return [];
  if (isMaster()) return app.groupOrder.slice();
  if (isAgent()) return app.groupOrder.filter(gid => app.groups[gid] && app.groups[gid].agentId === session.agentId);
  return [];
}

function ensureActiveGroupVisible() {
  const visible = visibleGroupIds();
  if (!visible.length) return;
  if (!visible.includes(app.activeGroupId)) {
    app.activeGroupId = visible[0];
    state = app.groups[visible[0]];
    if (state) formatter = makeMoneyFormatter(LOCALE, state.group.currency);
  }
}

function parseAgentHash(hashStr) {
  const h = String(hashStr || "").replace(/^#/, '');
  if (!h) return null;
  const params = {};
  for (const part of h.split('&')) {
    const eq = part.indexOf('=');
    if (eq > 0) {
      try {
        params[decodeURIComponent(part.slice(0, eq))] = decodeURIComponent(part.slice(eq + 1));
      } catch (e) {}
    }
  }
  if (params.agent && params.key) return { agentId: params.agent, token: params.key };
  return null;
}

function buildAgentLink(agentId) {
  const a = app && app.agents[agentId];
  if (!a) return "";
  try {
    const url = new URL(location.href);
    url.hash = `agent=${encodeURIComponent(agentId)}&key=${encodeURIComponent(a.token)}`;
    return url.toString();
  } catch (e) {
    const base = location.href.split('#')[0];
    return `${base}#agent=${encodeURIComponent(agentId)}&key=${encodeURIComponent(a.token)}`;
  }
}

function stripHash() {
  try {
    history.replaceState(null, '', location.pathname + location.search);
  } catch (e) {
    try { location.hash = ''; } catch (e2) {}
  }
}

/* ═══════════════════════════════════════════════════════════════════
   5. STATE
   ═══════════════════════════════════════════════════════════════════ */
let app = null;
let state = null;
let view = "home";
let editingId = null;
let editingAgentId = null;
let toastTimer = null;
let saveTimer = null;
let isLoading = false;
let formatter = makeMoneyFormatter(LOCALE, ZONE.currency);
let fileHandle = null;

let channel = null;
try { channel = new BroadcastChannel("susu-sync"); } catch (e) {}

const ID_RE = /^[A-Za-z0-9_-]{1,24}$/;

function blankGroup(id) {
  return {
    id: id || ("g" + Math.random().toString(36).slice(2, 9)),
    agentId: null,
    group: {
      name: "Susu Circle",
      country: ZONE.country, region: ZONE.region,
      currency: ZONE.currency, currencyManual: "",
      dial: ZONE.dial,
      amount: 1000, frequency: "Weekly",
      startDate: isoDate(), paybill: "",
      autoReceipt: false,
      feePercent: DEFAULT_FEE_PERCENT
    },
    cycle: 1,
    cycleOrder: [],
    roundPointer: 0,
    cycleSnapshot: null,
    members: [],
    payouts: []
  };
}

function blankApp() {
  const id = "g" + Math.random().toString(36).slice(2, 9);
  return {
    version: APP_VERSION,
    activeGroupId: id,
    groups: { [id]: blankGroup(id) },
    groupOrder: [id],
    agents: {},
    master: { pin: null },
    meta: {
      lastSaved: null, createdAt: new Date().toISOString(),
      revision: 0, autoSaveFile: false
    }
  };
}

function seed(id) {
  const s = blankGroup(id);
  s.cycle = 2;
  s.group.startDate = addDays(isoDate(), -7);
  if (s.group.region === "KE") s.group.paybill = "247247";
  s.group.feePercent = 5;
  const names = ["Amina Wanjiru","Joseph Otieno","Grace Mwangi","Peter Kamau","Fatuma Ali","David Ochieng"];
  names.forEach((name, i) => {
    s.members.push({
      id: "m" + Math.random().toString(36).slice(2,8),
      name,
      phone: s.group.dial ? "+" + s.group.dial + "7123456" + String(10+i) : "",
      position: i + 1,
      paid: i < 3 ? [1, 2] : [1],
      exemptCycle: 0
    });
  });
  s.payouts = [{
    cycle: 1, memberId: s.members[0].id, memberName: s.members[0].name,
    gross: 6000, managementFee: 300, feePercent: 5,
    amount: 5700, date: addDays(s.group.startDate, 6)
  }];
  const nonExempt = s.members.filter(m => m.exemptCycle !== s.cycle);
  s.cycleSnapshot = { amount: s.group.amount, count: nonExempt.length, feePercent: 5 };
  s.cycleOrder = s.members.slice().sort((a,b) => a.position - b.position).map(m => m.id);
  s.roundPointer = 1;
  return s;
}

function validateGroupState(g) {
  if (!g || typeof g !== "object") g = blankGroup();
  if (!g.id || !ID_RE.test(g.id)) g.id = "g" + Math.random().toString(36).slice(2, 9);

  g.agentId = (typeof g.agentId === "string" && ID_RE.test(g.agentId)) ? g.agentId : null;

  if (!g.group || typeof g.group !== "object") g.group = {};
  const grp = g.group;
  grp.name = (typeof grp.name === "string" && grp.name.trim()) ? grp.name.trim().slice(0, 60) : "Susu Circle";
  grp.amount = Math.max(1, parseInt(grp.amount, 10) || 1000);
  if (!Object.keys(CYCLE_DAYS).includes(grp.frequency)) grp.frequency = "Weekly";
  if (!grp.startDate || !parseDate(grp.startDate)) grp.startDate = isoDate();
  if (typeof grp.dial !== "string") grp.dial = ZONE.dial;
  if (typeof grp.paybill !== "string") grp.paybill = "";
  if (typeof grp.country !== "string") grp.country = ZONE.country;
  if (typeof grp.region !== "string") grp.region = ZONE.region;
  if (typeof grp.currencyManual !== "string") grp.currencyManual = "";
  grp.autoReceipt = grp.autoReceipt === true;

  if (grp.feePercent == null) {
    grp.feePercent = 0;
  } else {
    let pct = parseInt(grp.feePercent, 10);
    if (!Number.isFinite(pct)) pct = DEFAULT_FEE_PERCENT;
    pct = Math.max(0, Math.min(100, pct));
    grp.feePercent = pct;
  }

  if (grp.currencyManual && VALID_CURRENCIES.has(grp.currencyManual)) {
    grp.currency = grp.currencyManual;
  } else {
    grp.currencyManual = "";
    grp.currency = VALID_CURRENCIES.has(ZONE.currency) ? ZONE.currency : "USD";
  }

  g.cycle = Math.max(1, parseInt(g.cycle, 10) || 1);

  const seenIds = new Set();
  const rawMembers = Array.isArray(g.members) ? g.members : [];
  g.members = rawMembers
    .filter(m => m && typeof m === "object" && typeof m.name === "string" && m.name.trim())
    .map((m, i) => {
      let id = (typeof m.id === "string" && ID_RE.test(m.id)) ? m.id : "";
      if (!id || seenIds.has(id)) id = "m" + Math.random().toString(36).slice(2, 9);
      seenIds.add(id);
      const paid = Array.isArray(m.paid)
        ? [...new Set(m.paid.map(Number).filter(n => Number.isInteger(n) && n >= 1))]
        : [];
      paid.sort((a, b) => a - b);
      return {
        id,
        name: String(m.name).trim().slice(0, 60),
        phone: typeof m.phone === "string" ? m.phone.slice(0, 24) : "",
        position: Number.isInteger(m.position) ? m.position : (i + 1),
        paid,
        exemptCycle: Number.isInteger(m.exemptCycle) && m.exemptCycle >= 0 ? m.exemptCycle : 0
      };
    });
  g.members.sort((a, b) => a.position - b.position)
           .forEach((m, i) => { m.position = i + 1; });

  const rawPayouts = Array.isArray(g.payouts) ? g.payouts : [];
  g.payouts = rawPayouts
    .filter(p => p && Number.isFinite(Number(p.amount)))
    .map(p => {
      let mid = (typeof p.memberId === "string" && ID_RE.test(p.memberId)) ? p.memberId : "";
      if (!mid && typeof p.memberName === "string") {
        const found = g.members.find(m => m.name === p.memberName);
        if (found) mid = found.id;
      }
      let memberName = typeof p.memberName === "string" ? p.memberName : "";
      if (!memberName && mid) {
        const m = g.members.find(x => x.id === mid);
        if (m) memberName = m.name;
      }
      let pct = parseInt(p.feePercent, 10);
      if (!Number.isFinite(pct)) pct = 0;
      pct = Math.max(0, Math.min(100, pct));
      const amount = Math.max(0, parseInt(p.amount, 10) || 0);
      const managementFee = Math.max(0, parseInt(p.managementFee, 10) || 0);
      let gross = Math.max(0, parseInt(p.gross, 10) || 0);
      if (!gross) gross = amount + managementFee;
      return {
        cycle: Math.max(0, parseInt(p.cycle, 10) || 0),
        memberId: mid, memberName,
        gross, managementFee, feePercent: pct,
        amount,
        date: typeof p.date === "string" ? p.date : ""
      };
    });

  const memberIds = new Set(g.members.map(m => m.id));
  g.cycleOrder = Array.isArray(g.cycleOrder) ? g.cycleOrder.filter(id => memberIds.has(id)) : [];
  if (g.cycleOrder.length === 0 && g.members.length > 0) {
    g.cycleOrder = g.members.slice().sort((a, b) => a.position - b.position).map(m => m.id);
    g.roundPointer = 0;
  }
  if (typeof g.roundPointer !== "number" || g.roundPointer < 0) g.roundPointer = 0;
  if (g.roundPointer > g.cycleOrder.length) g.roundPointer = g.cycleOrder.length;

  if (g.cycleSnapshot && typeof g.cycleSnapshot === "object") {
    const amt = Math.max(1, parseInt(g.cycleSnapshot.amount, 10) || 0);
    const cnt = Math.max(0, parseInt(g.cycleSnapshot.count, 10) || 0);
    let fpct = parseInt(g.cycleSnapshot.feePercent, 10);
    if (!Number.isFinite(fpct)) fpct = 0;
    fpct = Math.max(0, Math.min(100, fpct));
    g.cycleSnapshot = (amt > 0 && cnt > 0)
      ? { amount: amt, count: cnt, feePercent: fpct }
      : null;
  } else {
    g.cycleSnapshot = null;
  }

  return g;
}

function validateApp(raw) {
  if (!raw || typeof raw !== "object") return blankApp();
  if (!raw.groups && raw.group && Array.isArray(raw.members)) return migrateToV9(raw);
  if (!raw.groups || typeof raw.groups !== "object") return blankApp();

  const groups = {};
  const order = [];
  for (const id of Object.keys(raw.groups)) {
    const g = raw.groups[id];
    if (!g || typeof g !== "object") continue;
    g.id = id;
    groups[id] = validateGroupState(g);
    order.push(id);
  }
  if (order.length === 0) return blankApp();

  let groupOrder = order;
  if (Array.isArray(raw.groupOrder)) {
    const kept = raw.groupOrder.filter(id => groups[id]);
    for (const id of order) if (!kept.includes(id)) kept.push(id);
    groupOrder = kept;
  }

  // Agents
  const agents = {};
  if (raw.agents && typeof raw.agents === "object") {
    for (const aid of Object.keys(raw.agents)) {
      const a = raw.agents[aid];
      if (!a || typeof a !== "object") continue;
      if (!ID_RE.test(aid)) continue;
      agents[aid] = {
        id: aid,
        name: (typeof a.name === "string" && a.name.trim()) ? a.name.trim().slice(0, 60) : "Agent",
        phone: typeof a.phone === "string" ? a.phone.slice(0, 24) : "",
        pin: typeof a.pin === "string" ? a.pin : null,
        token: (typeof a.token === "string" && a.token.length >= 8) ? a.token : genToken(),
        createdAt: typeof a.createdAt === "string" ? a.createdAt : new Date().toISOString()
      };
    }
  }
  // Clear dangling agentIds
  for (const gid of Object.keys(groups)) {
    const g = groups[gid];
    if (g.agentId && !agents[g.agentId]) g.agentId = null;
  }

  const masterPin = (raw.master && typeof raw.master.pin === "string" && raw.master.pin)
    ? raw.master.pin : null;

  const activeGroupId = groups[raw.activeGroupId] ? raw.activeGroupId : groupOrder[0];
  const m = raw.meta && typeof raw.meta === "object" ? raw.meta : {};
  const meta = {
    lastSaved: m.lastSaved || null,
    createdAt: m.createdAt || new Date().toISOString(),
    revision: Number.isInteger(m.revision) && m.revision >= 0 ? m.revision : 0,
    autoSaveFile: m.autoSaveFile === true
  };

  return {
    version: APP_VERSION, activeGroupId,
    groups, groupOrder,
    agents,
    master: { pin: masterPin },
    meta
  };
}

function migrateToV9(old) {
  if (!old || typeof old !== "object" || !old.group) return blankApp();
  const id = "g" + Math.random().toString(36).slice(2, 9);
  const g = {
    id,
    agentId: old.agentId || null,
    group: old.group,
    cycle: old.cycle,
    cycleOrder: old.cycleOrder || [],
    roundPointer: old.roundPointer || 0,
    cycleSnapshot: old.cycleSnapshot || null,
    members: old.members || [],
    payouts: old.payouts || []
  };
  const m = old.meta && typeof old.meta === "object" ? old.meta : {};
  return {
    version: APP_VERSION,
    activeGroupId: id,
    groups: { [id]: g },
    groupOrder: [id],
    agents: {},
    master: { pin: null },
    meta: {
      lastSaved: m.lastSaved || null,
      createdAt: m.createdAt || new Date().toISOString(),
      revision: Number.isInteger(m.revision) && m.revision >= 0 ? m.revision : 0,
      autoSaveFile: m.autoSaveFile === true
    }
  };
}

function migrateV7(legacy) {
  if (!legacy || typeof legacy !== "object") return null;
  if (!legacy.group || !Array.isArray(legacy.members)) return null;
  const s = blankGroup();
  s.group.name = legacy.group.name || s.group.name;
  s.group.amount = Math.max(1, parseInt(legacy.group.amount, 10) || 1000);
  s.group.paybill = legacy.group.paybill || "";
  s.group.feePercent = 0;
  s.group.currencyManual = (typeof legacy.group.currency === "string" && VALID_CURRENCIES.has(legacy.group.currency.toUpperCase()))
    ? legacy.group.currency.toUpperCase() : "";
  s.group.currency = s.group.currencyManual || s.group.currency;
  s.cycle = Math.max(1, parseInt(legacy.cycle, 10) || 1);
  s.members = (legacy.members || []).map((m, i) => ({
    id: (typeof m.id === "string" && ID_RE.test(m.id)) ? m.id : "m" + Math.random().toString(36).slice(2, 9),
    name: String(m.name || "").trim().slice(0, 60),
    phone: typeof m.phone === "string" ? m.phone.slice(0, 24) : "",
    position: i + 1,
    paid: Array.isArray(m.paid) ? m.paid.map(Number).filter(n => Number.isInteger(n) && n >= 1) : [],
    exemptCycle: Number.isInteger(m.exemptCycle) && m.exemptCycle >= 0 ? m.exemptCycle : 0
  }));
  s.payouts = (legacy.payouts || []).map(p => {
    const mid = (typeof p.memberId === "string" && ID_RE.test(p.memberId))
      ? p.memberId
      : (s.members.find(m => m.name === (p.name || p.memberName)) || {}).id || "";
    const memberName = p.memberName || p.name || (s.members.find(m => m.id === mid) || {}).name || "";
    const amount = Math.max(0, parseInt(p.amount, 10) || 0);
    return {
      cycle: parseInt(p.cycle, 10) || 0, memberId: mid, memberName,
      gross: amount, managementFee: 0, feePercent: 0,
      amount,
      date: typeof p.date === "string" ? p.date : ""
    };
  });
  const nonExempt = s.members.filter(m => m.exemptCycle !== s.cycle);
  if (nonExempt.length) s.cycleSnapshot = { amount: s.group.amount, count: nonExempt.length, feePercent: 0 };
  s.cycleOrder = s.members.slice().sort((a, b) => a.position - b.position).map(m => m.id);
  s.roundPointer = 0;
  return s;
}

async function loadState() {
  isLoading = true;
  let raw = null;
  try { raw = await Storage.get(KEY); } catch (e) { raw = null; }

  if (!raw) {
    try {
      const v8 = await Storage.get(LEGACY_KEY_V8);
      if (v8 && v8.group) {
        raw = migrateToV9(v8);
        await Storage.set(KEY, raw);
      }
    } catch (e) {}
  }
  if (!raw) {
    try {
      const v7 = await Storage.get(LEGACY_KEY_V7);
      if (v7) {
        const interim = migrateV7(v7);
        if (interim) {
          raw = migrateToV9(interim);
          await Storage.set(KEY, raw);
        }
      }
    } catch (e) {}
  }

  app = raw ? validateApp(raw) : blankApp();
  state = app.groups[app.activeGroupId];
  formatter = makeMoneyFormatter(LOCALE, state.group.currency);
  isLoading = false;
}

function save() {
  if (isLoading || !app) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 150);
}

async function flushSave() {
  saveTimer = null;
  if (!app) return;
  app.meta.revision = (app.meta.revision || 0) + 1;
  app.meta.lastSaved = new Date().toISOString();
  try {
    await Storage.set(KEY, app);
    if (channel) channel.postMessage({ type: "saved", revision: app.meta.revision });
  } catch (e) {
    console.warn("Save failed:", e);
    toast("Save failed — export backup now");
  }
  if (fileHandle) await writeToFile();
  updateStatusUI();
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden && saveTimer) {
    clearTimeout(saveTimer);
    flushSave();
  }
});
window.addEventListener("beforeunload", () => {
  if (saveTimer && app) {
    clearTimeout(saveTimer);
    saveTimer = null;
    app.meta.revision = (app.meta.revision || 0) + 1;
    app.meta.lastSaved = new Date().toISOString();
    Storage.setSync(KEY, app);
  }
});

if (channel) {
  channel.onmessage = async (e) => {
    if (!e.data || e.data.type !== "saved") return;
    if (saveTimer) return;
    const localRev = (app && app.meta && app.meta.revision) || 0;
    const incomingRev = Number(e.data.revision) || 0;
    if (incomingRev <= localRev) return;
    const myGroupId = app ? app.activeGroupId : null;
    await loadState();
    if (myGroupId && app.groups[myGroupId]) {
      app.activeGroupId = myGroupId;
      state = app.groups[myGroupId];
      formatter = makeMoneyFormatter(LOCALE, state.group.currency);
    }
    ensureCycleOrder();
    render();
  };
}

/* ═══════════════════════════════════════════════════════════════════
   5b. FILE SYSTEM ACCESS
   ═══════════════════════════════════════════════════════════════════ */
async function pickSaveFile() {
  if (!window.showSaveFilePicker) { toast("File picker not supported in this browser"); return; }
  try {
    fileHandle = await window.showSaveFilePicker({
      suggestedName: `susu-${isoDate()}.json`,
      types: [{ description: "Susu backup", accept: { "application/json": [".json"] } }]
    });
    app.meta.autoSaveFile = true;
    await writeToFile();
    save();
    toast("Auto-save to file enabled");
  } catch (e) {
    if (e.name !== "AbortError") toast("Could not open file");
  }
}

async function writeToFile() {
  if (!fileHandle) return false;
  try {
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify({
      app: "susu", version: APP_VERSION,
      exported: new Date().toISOString(),
      data: app
    }, null, 2));
    await w.close();
    return true;
  } catch (e) {
    console.warn("File write failed:", e);
    fileHandle = null;
    toast("File write failed — re-enable auto-save");
    return false;
  }
}

function disableAutoSaveFile() {
  fileHandle = null;
  app.meta.autoSaveFile = false;
  save();
  toast("Auto-save to file disabled");
}

/* ═══════════════════════════════════════════════════════════════════
   6. DERIVED
   ═══════════════════════════════════════════════════════════════════ */
const money = n => formatter.format(Math.round(Number(n) || 0));
const symbol = () => getCurrencySymbol(LOCALE, state?.group?.currency || ZONE.currency);
const members = () => state.members.slice().sort((a,b) => a.position - b.position);
const currentAmount = () => (state.cycleSnapshot && state.cycleSnapshot.amount) || state.group.amount;
const isPaid = (m, c) => m && Array.isArray(m.paid) && m.paid.includes(Number(c));
const isExempt = m => m && m.exemptCycle === state.cycle;
const needsToPay = m => !isPaid(m, state.cycle) && !isExempt(m);
const cycleEnd = c => addDays(state.group.startDate, CYCLE_DAYS[state.group.frequency] * c - 1);

const feePercent = () => {
  if (state.cycleSnapshot && state.cycleSnapshot.feePercent != null) {
    return state.cycleSnapshot.feePercent;
  }
  return state.group.feePercent != null ? state.group.feePercent : 0;
};

const grossPayoutAmt = () => {
  if (state.cycleSnapshot) return state.cycleSnapshot.amount * state.cycleSnapshot.count;
  const nonExempt = members().filter(m => !isExempt(m));
  return state.group.amount * nonExempt.length;
};

const payoutAmt = () => {
  const gross = grossPayoutAmt();
  const fee = Math.round(gross * feePercent() / 100);
  return gross - fee;
};

const pool = () => {
  const amt = currentAmount();
  const defaultPct = feePercent();
  const cyclePct = {};
  for (const p of state.payouts) cyclePct[p.cycle] = p.feePercent != null ? p.feePercent : 0;
  if (state.cycleSnapshot) {
    cyclePct[state.cycle] = state.cycleSnapshot.feePercent != null
      ? state.cycleSnapshot.feePercent : defaultPct;
  } else if (cyclePct[state.cycle] == null) {
    cyclePct[state.cycle] = defaultPct;
  }
  let balance = 0;
  for (const m of state.members) {
    for (const c of m.paid) {
      const pct = cyclePct[c] != null ? cyclePct[c] : defaultPct;
      balance += amt * (1 - pct / 100);
    }
  }
  for (const p of state.payouts) balance -= (+p.amount || 0);
  return Math.round(balance);
};

function groupFeeStats(g) {
  let settledFees = 0;
  for (const p of g.payouts) settledFees += (p.managementFee || 0);
  let pendingFees = 0;
  const snap = g.cycleSnapshot;
  if (snap) {
    const pct = snap.feePercent != null ? snap.feePercent : (g.group.feePercent || 0);
    const paidThisCycle = g.members.filter(m => m.paid.includes(g.cycle)).length;
    const pendingGross = paidThisCycle * snap.amount;
    pendingFees = Math.round(pendingGross * pct / 100);
  }
  return { settledFees, pendingFees, totalFees: settledFees + pendingFees };
}

function masterStats() {
  let totalFees = 0, settled = 0, pending = 0;
  const byAgent = { "": { id: "", name: "Unassigned", circles: 0, members: 0, fees: 0 } };
  const byCircle = [];
  for (const gid of app.groupOrder) {
    const g = app.groups[gid];
    if (!g) continue;
    const stats = groupFeeStats(g);
    totalFees += stats.totalFees;
    settled += stats.settledFees;
    pending += stats.pendingFees;
    const aid = g.agentId || "";
    const agentName = (aid && app.agents[aid]) ? app.agents[aid].name : "Unassigned";
    if (!byAgent[aid]) byAgent[aid] = { id: aid, name: agentName, circles: 0, members: 0, fees: 0 };
    byAgent[aid].circles++;
    byAgent[aid].members += g.members.length;
    byAgent[aid].fees += stats.totalFees;
    byCircle.push({
      id: gid, name: g.group.name, agentId: aid, agentName,
      members: g.members.length, fees: stats.totalFees,
      settled: stats.settledFees, pending: stats.pendingFees
    });
  }
  return { totalFees, settled, pending, byAgent, byCircle };
}

function ensureCycleOrder() {
  if (!Array.isArray(state.cycleOrder)) state.cycleOrder = [];
  const memberIds = new Set(state.members.map(m => m.id));
  state.cycleOrder = state.cycleOrder.filter(id => memberIds.has(id));
  if (state.cycleOrder.length === 0 && state.members.length > 0) {
    state.cycleOrder = members().map(m => m.id);
    state.roundPointer = 0;
  }
  if (typeof state.roundPointer !== "number" || state.roundPointer < 0) state.roundPointer = 0;
  if (state.roundPointer >= state.cycleOrder.length && state.cycleOrder.length > 0) {
    state.cycleOrder = members().map(m => m.id);
    state.roundPointer = 0;
  }
}

function nextPerson() {
  ensureCycleOrder();
  if (state.cycleOrder.length === 0) return null;
  for (let i = state.roundPointer; i < state.cycleOrder.length; i++) {
    const m = state.members.find(x => x.id === state.cycleOrder[i]);
    if (m) return m;
  }
  return state.members[0] || null;
}

function estimatePayoutCycle(memberId) {
  const order = state.cycleOrder || [];
  const pointer = state.roundPointer || 0;
  const idx = order.indexOf(memberId);
  if (idx < 0) {
    const sorted = members();
    const pos = sorted.findIndex(x => x.id === memberId);
    if (pos < 0) return null;
    return state.cycle + (order.length - pointer) + pos;
  }
  if (idx >= pointer) return state.cycle + (idx - pointer);
  return state.cycle + (order.length - pointer) + idx;
}

/* ═══════════════════════════════════════════════════════════════════
   7. TOAST + STATUS
   ═══════════════════════════════════════════════════════════════════ */
function toast(msg, action, duration) {
  const el = document.getElementById("toast");
  el.innerHTML = "";
  const span = document.createElement("span");
  span.textContent = msg;
  el.appendChild(span);
  if (action) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "toast-btn";
    btn.textContent = action.label;
    btn.onclick = (ev) => {
      ev.stopPropagation();
      try { action.onClick(); } catch (e) { console.error(e); }
      el.classList.remove("show");
    };
    el.appendChild(btn);
  }
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"),
    duration || (action ? 5000 : 2400));
}

function updateStatusUI() {
  const mode = Storage.getMode();
  const dot = document.getElementById("netDot");
  if (dot) {
    if (mode === "memory") {
      dot.className = "net-dot memory";
      dot.title = "Storage unavailable — data won't persist";
    } else if (!navigator.onLine) {
      dot.className = "net-dot offline";
      dot.title = "Offline — app still works";
    } else {
      dot.className = "net-dot";
      dot.title = "Online · " + (mode === "indexeddb" ? "IndexedDB" : "LocalStorage");
    }
  }
  const warn = document.getElementById("memoryWarning");
  if (warn) warn.hidden = (mode !== "memory");
}

window.addEventListener("online", updateStatusUI);
window.addEventListener("offline", updateStatusUI);

/* ═══════════════════════════════════════════════════════════════════
   8. WHATSAPP
   ═══════════════════════════════════════════════════════════════════ */
function openWhatsApp(member, kind, cycleOverride, opts) {
  opts = opts || {};
  if (!member || !member.phone) { toast("No WhatsApp number"); return false; }
  const to = digits(member.phone);
  if (!to) { toast("Invalid number"); return false; }
  const text = buildText(member, kind, cycleOverride);
  const url = `https://wa.me/${to}?text=${encodeURIComponent(text)}`;
  let w = null;
  try {
    w = window.open(url, "_blank");
    if (w) { try { w.opener = null; } catch (e) {} }
  } catch (e) {}
  if (!w) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => toast("Popup blocked — message copied"),
        () => toast("Popup blocked — allow popups to send")
      );
    } else { toast("Popup blocked — allow popups"); }
    return false;
  }
  if (!opts.silent) toast("Opening WhatsApp…");
  return true;
}

function buildText(m, kind, cycleOverride) {
  const g = state.group;
  const c = (cycleOverride != null) ? cycleOverride : state.cycle;
  const first = m.name.split(" ")[0];
  const amt = money(currentAmount());
  const pct = feePercent();
  const grossAmt = currentAmount();
  const feeAmt = Math.round(grossAmt * pct / 100);
  const netAmt = grossAmt - feeAmt;
  const acct = digits(m.phone).slice(-9);
  const cycleDue = fmtDate(cycleEnd(c));

  if (kind === "receipt") {
    const payDate = fmtDate(isoDate());
    const estCycle = estimatePayoutCycle(m.id);
    const estDate = estCycle ? fmtDate(cycleEnd(estCycle)) : "TBD";
    const lines = [
      `Hi ${first}, payment received ✅`, ``,
      `💰 Amount: ${amt}`, `🔄 Cycle: ${c}`, `📅 Paid: ${payDate}`, `⏰ Cycle ends: ${cycleDue}`
    ];
    if (pct > 0) {
      lines.push(``, `Breakdown:`);
      lines.push(`• To pool: ${money(netAmt)}`);
      lines.push(`• Management fee (${pct}%): ${money(feeAmt)}`);
    }
    if (g.paybill) lines.push(`💳 Paid to: ${g.paybill}`);
    lines.push(``, `🎯 Your payout: Cycle ${estCycle || "?"} · ${estDate}` + (pct > 0 ? " (net of fees)" : ""));
    lines.push(``, `Thank you!`, `— ${g.name}`);
    return lines.join("\n");
  }
  if (kind === "remind") {
    return `Hi ${first}, this is a friendly reminder from ${g.name}.\n\n` +
      `Your ${amt} for Cycle ${c} is still pending.\n\n` +
      (g.paybill ? `Pay to ${g.paybill}\nAccount: ${acct}\n\n` : "") +
      `Due: ${cycleDue}\n\nThank you!`;
  }
  if (kind === "payout") {
    const payoutDate = fmtDate(isoDate());
    const lines = [`🎉 Hi ${first}, you're the recipient for Cycle ${c} of ${g.name}!`, ``];
    if (pct > 0) {
      lines.push(`💰 Gross: ${money(grossPayoutAmt())}`);
      lines.push(`💼 Management fee (${pct}%): ${money(Math.round(grossPayoutAmt() * pct / 100))}`);
      lines.push(`✅ Net payout: ${money(payoutAmt())}`);
    } else {
      lines.push(`💰 Payout: ${money(payoutAmt())}`);
    }
    lines.push(`📅 Date: ${payoutDate}`);
    lines.push(``, `We'll send it shortly.`, `— ${g.name}`);
    return lines.join("\n");
  }
  if (kind === "welcome") {
    const estCycle = estimatePayoutCycle(m.id);
    const estDate = estCycle ? fmtDate(cycleEnd(estCycle)) : "TBD";
    return `Welcome ${first}! 👋\n\nYou've joined ${g.name}.\n\n` +
      `• Contribution: ${amt} ${g.frequency.toLowerCase()}\n` +
      (pct > 0 ? `• Management fee: ${pct}%\n` : "") +
      `• Turn: #${m.position}\n` +
      `• Estimated payout: Cycle ${estCycle || "?"} · ${estDate}\n\nGlad to have you!`;
  }
  return "";
}

/* ═══════════════════════════════════════════════════════════════════
   9. BACKUP / RESTORE
   ═══════════════════════════════════════════════════════════════════ */
function exportBackup() {
  try {
    const payload = {
      app: "susu", version: APP_VERSION,
      exported: new Date().toISOString(),
      data: app
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `susu-backup-${isoDate()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Backup downloaded");
  } catch (e) { toast("Export failed"); }
}

function triggerImport() { document.getElementById("importFile").click(); }

function normalizeImport(payload) {
  if (!payload || typeof payload !== "object") throw new Error("bad");
  if (payload.data && payload.data.groups && typeof payload.data.groups === "object") {
    return validateApp(payload.data);
  }
  if (payload.groups && typeof payload.groups === "object") {
    return validateApp(payload);
  }
  if (payload.state && payload.state.group) {
    return migrateToV9(payload.state);
  }
  if (payload.group && Array.isArray(payload.members)) {
    return migrateToV9(payload);
  }
  throw new Error("Unrecognized format");
}

async function handleImport(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    const newApp = normalizeImport(payload);
    const exportedAt = payload.exported ? ` from ${fmtDateTime(payload.exported)}` : "";
    if (!confirm(`Replace all current data with this backup${exportedAt}?`)) return;
    app = newApp;
    state = app.groups[app.activeGroupId];
    formatter = makeMoneyFormatter(LOCALE, state.group.currency);
    // Verify session still valid after import
    if (session) {
      if (session.role === 'agent' && !app.agents[session.agentId]) clearSession();
      if (session.role === 'master' && !app.master.pin) clearSession();
    }
    ensureCycleOrder();
    save(); render();
    toast("Restored from backup");
  } catch (e) {
    toast("Invalid backup file");
  }
}

function loginAgentByLink() {

    const url = new URL(input);

  } catch (e) {

  }

  clearSession();

/* ═══════════════════════════════════════════════════════════════════
   11. MEMBER / CYCLE ACTIONS
   ═══════════════════════════════════════════════════════════════════ */
function togglePaid(id) {
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  const c = state.cycle;
  const wasPaid = m.paid.includes(c);

  if (wasPaid) {
    m.paid = m.paid.filter(x => x !== c);
    const anyonePaid = state.members.some(x => x.paid.includes(c));
    if (!anyonePaid) state.cycleSnapshot = null;
    save(); render();
    toast("Marked unpaid");
    return;
  }

  if (!state.cycleSnapshot) {
    const nonExempt = state.members.filter(x => x.exemptCycle !== c);
    state.cycleSnapshot = {
      amount: state.group.amount,
      count: nonExempt.length,
      feePercent: state.group.feePercent != null ? state.group.feePercent : 0
    };
  }
  m.paid.push(c);
  m.paid.sort((a,b) => a-b);
  save(); render();

  const first = m.name.split(" ")[0];
  if (m.phone && state.group.autoReceipt) {
    toast(`${first} marked paid · opening receipt…`);
    openWhatsApp(m, "receipt", undefined, { silent: true });
  } else if (m.phone) {
    toast(`${first} marked paid`, {
      label: "Send receipt",
      onClick: () => openWhatsApp(m, "receipt")
    });
  } else {
    toast(`${first} marked paid`);
  }
}

function bulkMarkPaid() {
  const payers = members().filter(m => needsToPay(m));
  if (!payers.length) { toast("Everyone's already paid"); return; }
  if (!confirm(`Mark all ${payers.length} unpaid members as paid for cycle ${state.cycle}?`)) return;

  if (!state.cycleSnapshot) {
    const nonExempt = state.members.filter(x => x.exemptCycle !== state.cycle);
    state.cycleSnapshot = {
      amount: state.group.amount,
      count: nonExempt.length,
      feePercent: state.group.feePercent != null ? state.group.feePercent : 0
    };
  }
  payers.forEach(m => {
    if (!m.paid.includes(state.cycle)) {
      m.paid.push(state.cycle);
      m.paid.sort((a, b) => a - b);
    }
  });
  save(); render();

  const withPhone = payers.filter(m => m.phone);
  if (!withPhone.length) { toast(`${payers.length} marked paid`); return; }

  const paidCount = payers.length;
  const runChain = (autoStart) => {
    const queue = withPhone.slice();
    const total = queue.length;
    function next() {
      if (!queue.length) { toast("All receipts sent"); return; }
      const m = queue.shift();
      const sent = total - queue.length;
      const ok = openWhatsApp(m, "receipt", undefined, { silent: true });
      const blocked = ok ? "" : " (blocked)";
      const first = autoStart && sent === 1;
      if (queue.length > 0) {
        const msg = first
          ? `${paidCount} marked paid · receipt 1 of ${total}${blocked}`
          : `Receipt ${sent} of ${total}${blocked}`;
        toast(msg, { label: "Next receipt", onClick: next }, 20000);
      } else if (first) {
        toast(ok ? `${paidCount} marked paid · receipt sent` : `${paidCount} marked paid · receipt blocked`);
      } else {
        toast(ok ? `All ${total} receipts sent` : `Last receipt blocked`);
      }
    }
    next();
  };

  if (state.group.autoReceipt) runChain(true);
  else {
    toast(`${payers.length} marked paid`, {
      label: `Send ${withPhone.length} receipt${withPhone.length > 1 ? "s" : ""}`,
      onClick: () => runChain(false)
    }, 12000);
  }
}

function closeCycle() {
  const list = members();
  if (!list.length) { toast("Add members first"); return; }
  const unpaid = list.filter(m => needsToPay(m));
  if (unpaid.length) { toast(`${unpaid.length} still unpaid`); return; }
  const next = nextPerson();
  if (!next) { toast("No one to pay"); return; }

  const closedCycle = state.cycle;
  const gross = grossPayoutAmt();
  const pct = feePercent();
  const fee = Math.round(gross * pct / 100);
  const net = gross - fee;

  if (!confirm(`Give ${next.name} ${money(net)} and start Cycle ${closedCycle + 1}?` +
    (pct > 0 ? `\n\nManagement fee: ${money(fee)} (${pct}%)` : ""))) return;

  state.payouts.push({
    cycle: closedCycle, memberId: next.id, memberName: next.name,
    gross, managementFee: fee, feePercent: pct,
    amount: net, date: isoDate()
  });

  state.roundPointer = (state.roundPointer || 0) + 1;
  if (state.roundPointer >= state.cycleOrder.length) {
    state.roundPointer = 0;
    state.cycleOrder = members().map(m => m.id);
  }
  state.cycleSnapshot = null;
  state.cycle = closedCycle + 1;

  save(); render();
  toast(`${next.name.split(" ")[0]} paid · Cycle ${state.cycle} started`);

  if (next.phone && confirm(`Send WhatsApp payout notice to ${next.name.split(" ")[0]}?`)) {
    openWhatsApp(next, "payout", closedCycle);
  }
}

function openMember(id) {
  editingId = id || null;
  const m = id ? state.members.find(x => x.id === id) : null;
  document.getElementById("dlgTitle").textContent = m ? "Edit member" : "Add member";
  document.getElementById("dlgSub").textContent = m ? "Update their details." : "Everyone gets a turn to receive.";
  document.getElementById("fName").value = m ? m.name : "";
  document.getElementById("fPhone").value = m ? m.phone : "";
  const dlg = document.getElementById("memberDialog");
  if (!dlg.open) dlg.showModal();
  setTimeout(() => document.getElementById("fName").focus(), 40);
}

function saveMember(e) {
  e.preventDefault();
  const name = document.getElementById("fName").value.trim();
  const phoneRaw = document.getElementById("fPhone").value.trim();
  if (!name) { toast("Enter a name"); return; }
  const phone = normalizePhone(phoneRaw, state.group.dial);
  let newMember = null;

  if (editingId) {
    const m = state.members.find(x => x.id === editingId);
    if (m) { m.name = name; m.phone = phone; }
    toast("Saved");
  } else {
    const pos = state.members.reduce((mx, x) => Math.max(mx, x.position || 0), 0) + 1;
    const exempt = state.cycleSnapshot ? state.cycle : 0;
    newMember = {
      id: "m" + Math.random().toString(36).slice(2, 9),
      name, phone, position: pos, paid: [], exemptCycle: exempt
    };
    state.members.push(newMember);
    ensureCycleOrder();
    if (!state.cycleSnapshot && !state.cycleOrder.includes(newMember.id)) {
      state.cycleOrder.push(newMember.id);
    }
    toast(exempt ? `${name.split(" ")[0]} added · pays from cycle ${state.cycle + 1}` : `${name.split(" ")[0]} added`);
  }

  const dlg = document.getElementById("memberDialog");
  if (dlg.open) dlg.close();
  editingId = null;
  save(); render();
  if (newMember && phone && confirm(`Send a WhatsApp welcome to ${name.split(" ")[0]}?`)) {
    openWhatsApp(newMember, "welcome");
  }
}

function removeMember(id) {
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`Remove ${m.name}?`)) return;
  const idx = state.cycleOrder.indexOf(id);
  if (idx >= 0 && idx < state.roundPointer) state.roundPointer = Math.max(0, state.roundPointer - 1);
  state.cycleOrder = state.cycleOrder.filter(x => x !== id);
  state.members = state.members.filter(x => x.id !== id);
  state.members.sort((a, b) => a.position - b.position).forEach((x, i) => x.position = i + 1);
  if (state.cycleSnapshot) {
    state.cycleSnapshot.count = state.members.filter(x => x.exemptCycle !== state.cycle).length;
    if (state.cycleSnapshot.count === 0) state.cycleSnapshot = null;
  }
  ensureCycleOrder();
  save(); render();
  toast("Removed");
}

function moveMember(id, dir) {
  if (state.cycleSnapshot) { toast("Can't reorder mid-cycle"); return; }
  const sorted = members();
  const i = sorted.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return;
  const tmp = sorted[i].position;
  sorted[i].position = sorted[j].position;
  sorted[j].position = tmp;
  state.cycleOrder = members().map(m => m.id);
  state.roundPointer = 0;
  save(); render();
}

/* ═══════════════════════════════════════════════════════════════════
   12. SETTINGS ACTIONS
   ═══════════════════════════════════════════════════════════════════ */
function saveSettings() {
  const g = state.group;
  const wasFrozen = !!state.cycleSnapshot;
  const oldAmount = g.amount;
  const oldFee = g.feePercent;

  g.name = document.getElementById("sName").value.trim() || "Susu Circle";
  g.amount = Math.max(1, parseInt(document.getElementById("sAmount").value, 10) || 1);
  g.frequency = document.getElementById("sFrequency").value;
  g.paybill = document.getElementById("sPaybill").value.trim();

  const feeInput = document.getElementById("sFeePercent");
  if (feeInput && isMaster()) {
    let pct = parseFloat(feeInput.value);
    if (!Number.isFinite(pct)) pct = DEFAULT_FEE_PERCENT;
    pct = Math.max(0, Math.min(100, pct));
    g.feePercent = pct;
  }

  // Agent assignment only master can change
  if (isMaster()) {
    const agentSel = document.getElementById("sAgent");
    if (agentSel) {
      const aid = agentSel.value || null;
      state.agentId = (aid && app.agents[aid]) ? aid : null;
    }
  }

  const manualCurrency = document.getElementById("sCurrency").value;
  if (manualCurrency === "__auto__") {
    g.currencyManual = "";
    g.currency = VALID_CURRENCIES.has(ZONE.currency) ? ZONE.currency : "USD";
  } else if (VALID_CURRENCIES.has(manualCurrency)) {
    g.currencyManual = manualCurrency;
    g.currency = manualCurrency;
  }
  formatter = makeMoneyFormatter(LOCALE, g.currency);
  save(); render();

  const changes = [];
  if (wasFrozen && oldAmount !== g.amount) changes.push(`amount applies cycle ${state.cycle + 1}`);
  if (wasFrozen && oldFee !== g.feePercent) changes.push(`fee applies cycle ${state.cycle + 1}`);
  if (changes.length) toast(`Saved · ${changes.join(" · ")}`);
  else toast("Saved");
}

function toggleAutoReceipt(btn) {
  state.group.autoReceipt = !state.group.autoReceipt;
  if (btn) {
    btn.classList.toggle("on", state.group.autoReceipt);
    btn.setAttribute("aria-pressed", String(state.group.autoReceipt));
  }
  save();
  toast(state.group.autoReceipt ? "Auto-receipts on" : "Auto-receipts off");
}

function reDetect() {
  state.group.region = ZONE.region;
  state.group.country = ZONE.country;
  state.group.dial = ZONE.dial;
  state.group.currencyManual = "";
  state.group.currency = VALID_CURRENCIES.has(ZONE.currency) ? ZONE.currency : "USD";
  formatter = makeMoneyFormatter(LOCALE, state.group.currency);
  save(); render();
  toast(`Detected: ${ZONE.country || "unknown"} · ${ZONE.currency}`);
}

function resetCurrentGroup() {
  if (!confirm(`Reset "${state.group.name}"? Members and payouts will be erased, settings kept.`)) return;
  const id = app.activeGroupId;
  const oldName = state.group.name;
  const oldAuto = state.group.autoReceipt;
  const oldFee = state.group.feePercent;
  const oldAgent = state.agentId;
  const fresh = blankGroup(id);
  fresh.group.name = oldName;
  fresh.group.autoReceipt = oldAuto;
  fresh.group.feePercent = oldFee;
  fresh.agentId = oldAgent;
  app.groups[id] = fresh;
  state = fresh;
  formatter = makeMoneyFormatter(LOCALE, state.group.currency);
  save(); render();
  toast("Reset");
}

function loadDemo() {
  const isPristine = state.members.length === 0 && state.payouts.length === 0
    && state.group.name === "Susu Circle";
  if (isPristine) {
    const seeded = seed(app.activeGroupId);
    if (isAgent()) seeded.agentId = session.agentId;
    app.groups[app.activeGroupId] = seeded;
    state = seeded;
  } else {
    const id = "g" + Math.random().toString(36).slice(2, 9);
    const demo = seed(id);
    demo.group.name = "Demo Circle";
    if (isAgent()) demo.agentId = session.agentId;
    app.groups[id] = demo;
    app.groupOrder.push(id);
    app.activeGroupId = id;
    state = demo;
  }
  formatter = makeMoneyFormatter(LOCALE, state.group.currency);
  ensureCycleOrder();
  save(); render();
  toast("Demo data loaded");
}
